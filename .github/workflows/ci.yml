name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desafio
          POSTGRES_PASSWORD: desafio
          POSTGRES_DB: checkin_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Liga o teste do repositório contra o Postgres de verdade
      TEST_DATABASE_URL: postgres://desafio:desafio@localhost:5432/checkin_teste
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Sobe tudo como o avaliador faria e faz um check-in de verdade
  compose:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait
      - name: Check-in de ponta a ponta
        run: |
          curl --fail-with-body -X POST http://localhost:3000/checkins \
            -H 'Content-Type: application/json' -d '{"cpf":"111.111.111-11"}'
          curl --fail-with-body http://localhost:3000/checkins | grep 'Ana Souza'
          curl --fail --silent --output /dev/null http://localhost:5173
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
