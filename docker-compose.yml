# Sobe tudo com: docker compose up --build
# Tela: http://localhost:5173 · API: http://localhost:3000 · Cadastro: http://localhost:4000

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  # A fila fica em memória (ver ENTREGA.md), então o banco não sobe por padrão.
  # Para subir mesmo assim: docker compose --profile banco up
  db:
    image: postgres:16-alpine
    profiles: ["banco"]
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      CADASTRO_URL: http://mock-service:4000
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - mock-service

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
